version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # 运行时依赖升级合并为一个 PR
      runtime-deps:
        dependency-type: production
        update-types:
          - minor
          - patch
      # 开发依赖升级合并为一个 PR
      dev-deps:
        dependency-type: development
        update-types:
          - minor
          - patch
