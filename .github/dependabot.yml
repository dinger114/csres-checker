version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # 运行时依赖升级合并为一个 PR
      runtime-deps:
        dependency-type: production
        update-types:
          - minor
          - patch
      # 开发依赖升级合并为一个 PR
      dev-deps:
        dependency-type: development
        update-types:
          - minor
          - patch

  # M7: Worker 子目录有独立 package.json(capjs-core 等),需单独跟踪
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      worker-deps:
        update-types:
          - minor
          - patch

  # M7: GitHub Actions 工作流自身依赖(actions/checkout 等)定期更新
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
