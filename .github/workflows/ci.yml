name: CI

on:
  push:
    branches: [main, refactor/vue3-worker-edge]
  pull_request:

# S16: 显式声明最小权限,不依赖仓库默认 token 权限(workflow 级,所有 job 继承)
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # lockfile 由 npm 11 生成(本地开发与 Dependabot 都是);runner 自带的 npm 10
      # 会因 optional peer 缺项误报 `Missing: typescript@7.0.2 from lock file`
      - name: Use npm 11
        run: npm install --global npm@11

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # 同 quality job:npm 版本与生成 lockfile 的一方对齐
      - name: Use npm 11
        run: npm install --global npm@11

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          sudo apt-get update
          timeout 600 npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e
